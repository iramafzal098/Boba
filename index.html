<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Someone Special 💖</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
  color: #fff;
}

.container {
  background: rgba(255, 255, 255, 0.15);
  padding: 40px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  width: 90%;
  max-width: 400px;
}

button {
  margin: 10px;
  padding: 12px 20px;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  font-size: 16px;
  transition: 0.3s;
}

.primary {
  background: #ff4b5c;
  color: white;
}

.secondary {
  background: white;
  color: #ff4b5c;
}

button:hover {
  transform: scale(1.1);
}
</style>
</head>

<body>

<div class="container" id="content">
  <h2>Hello handsome 💌</h2>
  <p>Click below... QnA time 😌</p>
  <button class="primary" onclick="startQna()">Click Me</button>
</div>

<script>

function startQna() {
  document.getElementById("content").innerHTML = `
    <h2>Question 1 😏</h2>
    <p>Who is the cutest person you know?</p>
    <button class="primary" onclick="nextQna()">You 💖</button>
  `;
}

function nextQna() {
  document.getElementById("content").innerHTML = `
    <h2>Question 2 🥰</h2>
    <p>Who makes your days better?</p>
    <button class="primary" onclick="finalAsk()">You only 💕</button>
  `;
}

function finalAsk() {
  document.getElementById("content").innerHTML = `
    <h2>Okay last question...</h2>
    <p style="font-size:20px;">Will you be my Valentine? 💘</p>
    <button class="primary" onclick="yesAnswer()">YES 💖</button>
    <button class="secondary" onmouseover="moveButton(this)">No 🙈</button>
  `;
}

function yesAnswer() {
  document.getElementById("content").innerHTML = `
    <h2>Yayyyyy!!! 🥳💖</h2>
    <p>I knew it 😌 Can't wait for our Valentine moment 💕</p>
  `;
}

function moveButton(button) {
  button.style.position = "absolute";
  button.style.top = Math.random() * 80 + "%";
  button.style.left = Math.random() * 80 + "%";
}

</script>

</body>
</html>
