<!DOCTYPE html>
<html lang="en">
<head>

<title>For My Bug 💖</title>

<style>
body {

  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
  color: white;
}

.container {
  background: rgba(255, 255, 255, 0.15);
  padding: 40px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  width: 90%;
  max-width: 420px;
  position: relative;
}

button {
  margin: 8px;
  padding: 12px 20px;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  font-size: 15px;
  transition: 0.3s;
}

.primary {
  background: #ff2e63;
  color: white;
}

.secondary {
  background: white;
  color: #ff2e63;
}

.back {
  background: transparent;
  color: white;
  border: 1px solid white;
}

button:hover {
  transform: scale(1.05);
}

.heart {
  position: fixed;
  font-size: 20px;
  animation: float 4s linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}
</style>
</head>

<body>

  <h2>Hey Bug 🐞💌</h2>
  <p>I made this just for you...</p>
  <button class="primary" onclick="start()">Open 😌</button>
</div>

<script>

  step = 1;
  render();

      <br><br>
      <button class="back" onclick="back()">⬅️ Back</button>
    `;
  }

  if (step === 3) {

      <button class="secondary" onclick="next()">Both of us 💖</button>
      <br><br>
      <button class="back" onclick="back()">⬅️ Back</button>
    `;
  }

  if (step === 4) {
    content.innerHTML = `
      <h2>Important question 💘</h2>
      <p style="font-size:20px;">Will you be my Valentine?</p>
      <button class="primary" onclick="yes()">YES 💖</button>
      <button class="secondary" onmouseover="run(this)">No 🙈</button>
      <br><br>
      <button class="back" onclick="back()">⬅️ Back</button>
    `;
  }
}

  render();
}
