<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Bug 💖</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
  color: white;
}

.container {
  background: rgba(255, 255, 255, 0.18);
  padding: 35px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  width: 90%;
  max-width: 430px;
}

button {
  margin: 8px;
  padding: 12px 22px;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  font-size: 15px;
  transition: 0.3s;
}

.primary {
  background: #ff2e63;
  color: white;
}

.secondary {
  background: white;
  color: #ff2e63;
}

.back {
  background: transparent;
  color: white;
  border: 1px solid white;
}

button:hover {
  transform: scale(1.05);
}

.heart {
  position: fixed;
  font-size: 20px;
  animation: float 4s linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}
</style>
</head>

<body>

<div class="container" id="content"></div>

<script>
let step = 0;

render();

function render() {
  const c = document.getElementById("content");

  if (step === 0) {
    c.innerHTML = `
      <h2>Hey Mr Handsome Bug 🐞💌</h2>
      <p>I made something special for you…</p>
      <button class="primary" onclick="next()">Open 😌</button>
    `;
  }

  if (step === 1) {
    c.innerHTML = `
      <h2>QnA Time 😏</h2>
      <p>Who is my favorite human?</p>
      <button class="primary" onclick="next()">Bug 🐞</button>
      <button class="secondary" onclick="next()">You 🥰</button>
      <button class="secondary" onclick="next()">Obviously me 😌</button>
      <br><br>
      <button class="back" onclick="back()">⬅️ Back</button>
    `;
  }

  if (step === 2) {
    c.innerHTML = `
      <h2>Another one 💕</h2>
      <p>Who makes my days brighter?</p>
      <button class="primary" onclick="next()">Your smile 😊</button>
      <button class="secondary" onclick="next()">Your hugs 🤍</button>
      <button class="secondary" onclick="next()">Everything about you 🥺</button>
      <br><br>
      <button class="back" onclick="back()">⬅️ Back</button>
    `;
  }

  if (step === 3) {
    c.innerHTML = `
      <h2>Almost there…</h2>
      <p>Who owns my heart?</p>
      <button class="primary" onclick="next()">Bug 🐞</button>
      <button class="secondary" onclick="next()">Me 😌</button>
      <button class="secondary" onclick="next()">Both of us 💖</button>
      <br><br>
      <button class="back" onclick="back()">⬅️ Back</button>
    `;
  }

  if (step === 4) {
    c.innerHTML = `
      <h2>Important Question 💘</h2>
      <p style="font-size:20px;">Will you be my Valentine?</p>
      <button class="primary" onclick="yes()">YES 💖</button>
      <button class="secondary" onmouseover="run(this)">No 🙈</button>
      <br><br>
      <button class="back" onclick="back()">⬅️ Back</button>
    `;
  }
}

function next() {
  step++;
  render();
}

function back() {
  step--;
  render();
}

function yes() {
  document.getElementById("content").innerHTML = `
    <h2>Hehe 😌💍</h2>
    <p style="font-size:18px;">
      So finally…<br><br>
      you’re officially <b>booked</b> for every Valentine<br>
      for your <b>whole life</b> 💖
    </p>
    <p>No cancellations allowed 🐞😌</p>
    <button class="primary" onclick="restart()">Start Over 🔁</button>
  `;
  hearts();
}

function restart() {
  step = 0;
  render();
}

function run(btn) {
  btn.style.position = "absolute";
  btn.style.top = Math.random() * 80 + "%";
  btn.style.left = Math.random() * 80 + "%";
}

function hearts() {
  setInterval(() => {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "💖";
    h.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 4000);
  }, 300);
}
</script>

</body>
</html>
